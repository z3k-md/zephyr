<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocked for focus</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #16181d;
        color: #f2f3f5;
        font:
          16px/1.45 system-ui,
          sans-serif;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #b7bcc6;
      }
      .time {
        margin-top: 18px;
        color: #f2f3f5;
        font-size: 40px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">This site is blocked for focus</h1>
      <p>It opens again when the session ends.</p>
      <p class="time" id="left"></p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const host = params.get('host') || 'This site';
      const until = Number(params.get('until') || 0);
      document.getElementById('title').textContent = `${host} is blocked for focus`;

      function clock(seconds) {
        const left = Math.max(0, Math.ceil(seconds));
        const hours = Math.floor(left / 3600);
        const minutes = Math.floor((left % 3600) / 60);
        const secs = String(left % 60).padStart(2, '0');
        return hours
          ? `${hours}:${String(minutes).padStart(2, '0')}:${secs}`
          : `${minutes}:${secs}`;
      }

      function tick() {
        const left = until - Date.now() / 1000;
        document.getElementById('left').textContent = clock(left);
      }
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
