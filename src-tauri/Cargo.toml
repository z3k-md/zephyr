[package]
name = "zephyr"
version = "1.3.1"
description = "Desktop dispatch bar"
authors = ["Zach Connelly"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "zephyr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
# Share the native TLS stack with the suggestion client instead of also compiling rustls.
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "charset", "native-tls"] }
urlencoding = "2.1"
log = "0.4"
flexi_logger = "0.31"
ignore = "0.4"
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSWorkspace",
] }
tauri-nspanel = "2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
