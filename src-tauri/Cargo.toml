[package]
name = "zephyr"
version = "2.10.0"
description = "Desktop dispatch bar"
authors = ["Zach Connelly"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "zephyr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
# Share the native TLS stack with the suggestion client instead of also compiling rustls.
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["native-tls", "system-proxy"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "charset", "native-tls", "stream"] }
# The speed test streams its uploads.
bytes = "1"
futures-util = { version = "0.3", default-features = false }
urlencoding = "2.1"
log = "0.4"
flexi_logger = "0.31"
ignore = "0.4"
notify = "8"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
chrono = "0.4"
fend-core = "1.5"
chrono-tz = "0.10"
tauri-plugin-deep-link = "2"
url = "2"
chacha20poly1305 = "0.11"
base64 = "0.23"
sha2 = "0.11"
getrandom = "0.4"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
data-encoding = "2"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
if-addrs = "0.15.0"
socket2 = "0.6"
tokio = { version = "1", features = ["sync", "time"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "user"] }
tauri-plugin-drag = "2.1.1"
# Resources: the battery, where there is one.
starship-battery = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSWorkspace",
    "NSGraphicsContext",
    "NSImage",
    "objc2-core-graphics",
] }
objc2-core-graphics = "0.3"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
tauri-nspanel = "2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Wdk_Graphics_Direct3D",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
# Clipboard images: Windows hands over bitmaps, history keeps PNG.
png = "0.18"

[target."cfg(unix)".dependencies]
libc = "0.2"

# Release builds are built once per version, so they take the slow, thorough path: smaller
# and faster installs. Panics still unwind, so a crash in one thread is logged, not fatal.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Dev builds keep file and line numbers for backtraces, but not full debug info, which
# makes linking and the target folder much smaller. Dependencies keep none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
