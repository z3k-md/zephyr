[package]
name = "zephyr"
version = "1.3.1"
description = "Desktop dispatch bar"
authors = ["Zach Connelly"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "zephyr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
# Share the native TLS stack with the suggestion client instead of also compiling rustls.
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "charset", "native-tls"] }
urlencoding = "2.1"
log = "0.4"
flexi_logger = "0.31"
ignore = "0.4"
notify = "8"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
chrono = "0.4"
arboard = { version = "3", default-features = false }
fend-core = "1.5"
chrono-tz = "0.10"
tauri-plugin-deep-link = "2"
url = "2"
chacha20poly1305 = "0.10"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-vision = "0.3"
tauri-nspanel = "2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"
