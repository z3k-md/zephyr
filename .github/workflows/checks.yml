name: Checks
# main only moves to commits already checked on develop, so pushes there aren't checked again.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  # By hand, when GitHub drops a push event and a commit is left unchecked.
  workflow_dispatch:

# On develop a running check always finishes, so pushes in quick succession still leave a checked
# commit behind; GitHub keeps only the newest of the waiting runs. A pull request's newer push
# makes its older run moot.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # To find the last develop commit whose checks passed.
  actions: read

# No debug info: CI never debugs, and it makes linking, the target dir and the cache smaller.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # The ruleset requires these two by name ("Checks (windows-latest)", "Checks (macos-latest)"),
  # so renaming the matrix values blocks promotion until the ruleset is updated. Skipped steps
  # still pass, so a change that skips the Rust half can be promoted.
  checks:
    name: Checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A push is compared with the last develop commit whose checks passed, not the push's own
      # parent, so a change whose run was superseded is still covered by the next one. Pull
      # requests, runs by hand and a missing or unrelated base check everything.
      - name: What changed
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          if [ "${{ github.event_name }}" = push ]; then
            base=$(gh run list --workflow checks.yml --branch develop --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""' || true)
          fi
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD 2> /dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
            printf 'Since %s:\n%s\n' "$base" "$changed"
            printf '%s\n' "$changed" | bash scripts/changes.sh >> "$GITHUB_OUTPUT"
          else
            printf 'rust=true\nweb=true\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # ReFS on a virtual disk is much faster than the runner's disk for cargo's many small files.
      # Mounted over the still-empty target dir, so its path (and so the cache key) doesn't change
      # and the cache restores straight onto it.
      - name: Dev Drive
        if: runner.os == 'Windows' && steps.changes.outputs.rust == 'true'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          mount-path: ${{ github.workspace }}/src-tauri/target

      # Only develop writes the cargo cache; PR runs read it.
      - uses: ./.github/actions/setup
        with:
          rust: ${{ steps.changes.outputs.rust }}
          save-cache: ${{ github.ref == 'refs/heads/develop' }}

      # The frontend checks and formatting are the same on both systems, so only macOS runs them.
      - name: Check formatting
        if: runner.os == 'macOS'
        run: bunx prettier --check .

      - name: Check Rust formatting
        if: runner.os == 'macOS' && steps.changes.outputs.rust == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # vue-tsc runs under Node: under Bun on Windows it skips .vue files without saying so.
      - name: Typecheck frontend
        if: runner.os == 'macOS' && steps.changes.outputs.web == 'true'
        run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit

      - name: Frontend tests
        if: runner.os == 'macOS' && steps.changes.outputs.web == 'true'
        run: bun run test:web

      # tauri::generate_context! embeds dist/, so the Rust steps need it built first.
      - name: Build frontend
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.rust == 'true'
        run: bun run vite build

      - name: Clippy
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  scripts:
    name: Test release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The release scripts' file name matching and the version stamping, which otherwise
      # only run during a release. No dependencies to install.
      - run: node --test "scripts/*.test.mjs"

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint checks expressions, job wiring and the run scripts (through shellcheck).
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
