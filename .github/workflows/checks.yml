name: Checks
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: |
          bunx prettier --check .
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Typecheck and build frontend
        # tauri::generate_context! embeds dist/, so the Rust steps need it built first.
        run: bun run vue-tsc --noEmit && bun run vite build

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
