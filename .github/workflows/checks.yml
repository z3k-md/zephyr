name: Checks
# main only moves to commits already checked on develop, so pushes there aren't checked again.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  # By hand, when GitHub drops a push event and a commit is left unchecked.
  workflow_dispatch:

# A newer push to the same branch makes the older run moot.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

# No debug info: CI never debugs, and it makes linking, the target dir and the cache smaller.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # The ruleset requires these two by name ("Checks (windows-latest)", "Checks (macos-latest)"),
  # so renaming the matrix values blocks promotion until the ruleset is updated.
  checks:
    name: Checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only develop writes the cargo cache; PR runs read it.
      - uses: ./.github/actions/setup
        with:
          save-cache: ${{ github.ref == 'refs/heads/develop' }}

      - name: Check formatting
        run: |
          bunx prettier --check .
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Typecheck and build frontend
        # tauri::generate_context! embeds dist/, so the Rust steps need it built first.
        # vue-tsc runs under Node: under Bun on Windows it skips .vue files without saying so.
        run: |
          node node_modules/vue-tsc/bin/vue-tsc.js --noEmit
          bun run vite build

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint checks expressions, job wiring and the run scripts (through shellcheck).
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
