name: Release
# Releases are cut on demand (Actions > Release > Run workflow), only from main, which moves
# only when develop is promoted.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish instead of cutting a new version
        required: false

# Each release pushes a tag, so two runs must never overlap.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# No checks of its own: main only takes commits whose checks passed on develop.
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ inputs.tag != '' && 'true' || steps.semantic.outputs.published }}
      version: ${{ steps.semantic.outputs.version }}
      tag: ${{ inputs.tag || steps.semantic.outputs.tag }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      # Fails instead of skipping, so a run from the wrong branch doesn't show up as a success.
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release runs only from main, not $GITHUB_REF_NAME."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads the whole commit history

      - uses: ./.github/actions/setup
        with:
          rust: false

      # A rebuild only takes a tag that main already contains, so it can't ship unchecked code.
      - name: Require tag on main
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git merge-base --is-ancestor "refs/tags/$TAG" HEAD; then
            echo "::error::$TAG is not on main."
            exit 1
          fi

      - name: Semantic release
        id: semantic
        if: inputs.tag == ''
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/notes.md

      - name: Report nothing to release
        if: inputs.tag == '' && steps.semantic.outputs.published != 'true'
        run: |
          echo "::warning::No feat or fix commits since the last tag, so nothing was released."
          echo "Nothing to release: no feat or fix commits since the last tag." >> "$GITHUB_STEP_SUMMARY"

      # The release stays a draft until every platform is uploaded, so the updater never
      # sees a release that is missing its installers or latest.json.
      - name: Create draft release
        id: draft
        if: inputs.tag != '' || steps.semantic.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || steps.semantic.outputs.tag }}
        # The release list lags behind creation, so the id comes from the create response.
        # A rerun for an existing tag reuses the draft left by the earlier attempt.
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\" and .draft)][0].id // empty")
          if [ -z "$id" ]; then
            notes=$(cat "$RUNNER_TEMP/notes.md" 2> /dev/null || true)
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Zephyr $TAG" -f body="$notes" -F draft=true --jq .id)
          fi
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.published == 'true'
    name: Build (${{ matrix.name }})
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            args: ''
          # Apple silicon only; Intel Macs aren't supported. The explicit target (the runner's
          # own) names the bundles _aarch64, which the updater manifest maps to darwin-aarch64.
          - name: macos
            platform: macos-latest
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      # Releases only push a tag (main is protected), so the version is stamped here.
      # tauri.conf.json reads it from package.json.
      - name: Set version from tag
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm pkg set version="${TAG#v}"

      - uses: ./.github/actions/setup

      # Signs with the self-signed certificate in the Apple secrets, which keeps the same identity
      # from release to release, so macOS keeps Zephyr's permissions across updates. Without a
      # certificate the app is ad-hoc signed: it still installs and updates but loses its
      # permissions every update. No notarizing: that needs an Apple Developer ID.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        # Tauri's own import of APPLE_CERTIFICATE only finds Apple-issued identities
        # ("Developer ID Application: …") and fails on a self-signed one, so the certificate
        # goes into a keychain here and Tauri gets just the identity's name to sign with.
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # Splits on purpose: one argument per keychain already in the search list.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.version.outputs.release_id }}
          args: ${{ matrix.args }}
          # The publish job writes latest.json once every platform is uploaded.
          uploadUpdaterJson: false
          retryAttempts: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Upload updater manifest
        run: node scripts/updater-manifest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
          REQUIRED_PLATFORMS: windows-x86_64,darwin-aarch64

      # Plain labels on the installers and a Download section on top of the notes.
      - name: Label downloads
        run: node scripts/release-downloads.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}

      # The tag is named again on publish: a reused draft can come out "untagged-…", which
      # breaks every download link (v2.8.0 did).
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f tag_name="$TAG" -F draft=false -f make_latest=true
