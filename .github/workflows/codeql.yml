name: CodeQL
# Code scanning, without building anything (build-mode none). The frontend, scripts and
# workflows are scanned on every push to develop; Rust takes longer to extract, so it runs weekly.
on:
  push:
    branches: [develop]
    paths-ignore: ['**.md']
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: >-
          ${{ github.event_name == 'push'
            && fromJSON('["javascript-typescript", "actions"]')
            || fromJSON('["javascript-typescript", "actions", "rust"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
