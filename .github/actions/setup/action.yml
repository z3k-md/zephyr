name: Setup
description: Bun, Node and frontend dependencies, plus the pinned Rust toolchain and its cache.

inputs:
  rust:
    description: Install the Rust toolchain from rust-toolchain.toml and restore the cargo cache
    default: 'true'
  save-cache:
    description: Save the cargo cache when the job ends
    default: 'true'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # rustup reads rust-toolchain.toml. `toolchain install` with no name needs rustup 1.28+;
    # older rustup installs it on `rustup show`.
    - name: Install Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: |
        rustup toolchain install 2> /dev/null || rustup show
        rustc --version

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.rust == 'true'
      with:
        workspaces: src-tauri
        save-if: ${{ inputs.save-cache }}

    - name: Install frontend dependencies
      shell: bash
      run: bun install --frozen-lockfile
